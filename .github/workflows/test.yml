
name: Tests and Test Impact Analysis

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

      - name: Analyze test impact
        if: github.event_name == 'pull_request'
        run: test-impact --repo . --base "origin/${{ github.base_ref }}" --head HEAD --format markdown --output test-impact-report.md

      - name: Upload test impact report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: test-impact-report
          path: test-impact-report.md
          if-no-files-found: ignore
